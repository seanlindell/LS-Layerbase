# pnpm reads its settings from here rather than from package.json.
#
# Only the packages listed as `true` may run install scripts.
allowBuilds:
  # Has prebuilt binaries, and its fallback build needs Python and a compiler.
  better-sqlite3: false
  esbuild: true
  unrs-resolver: true
  "@parcel/watcher": true
  vue-demi: true
