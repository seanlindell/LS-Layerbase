name: Release

# Push a tag `vX.Y.Z` on `main` to release. The tag must be the version in
# package.json, and CHANGELOG.md must have a section for it.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag is the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json has version $version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Take the release notes from CHANGELOG.md
        run: ./scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
